<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="blur-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="80" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#0B0F19"/>
  
  <!-- Subtle Grid Pattern -->
  <path d="M0 100 H1200 M0 200 H1200 M0 300 H1200 M0 400 H1200 M0 500 H1200" stroke="#1E293B" stroke-width="1"/>
  <path d="M200 0 V630 M400 0 V630 M600 0 V630 M800 0 V630 M1000 0 V630" stroke="#1E293B" stroke-width="1"/>
  
  <!-- Glowing circle effect -->
  <circle cx="1000" cy="150" r="150" fill="#2563EB" opacity="0.25" filter="url(#blur-glow)" />
  <circle cx="150" cy="500" r="120" fill="#8B5CF6" opacity="0.2" filter="url(#blur-glow)" />

  <!-- Logo IS -->
  <g transform="translate(100, 80)">
    <rect width="70" height="70" rx="16" fill="#2563EB" />
    <text x="35" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="900" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">IS</text>
  </g>

  <!-- Main Copy -->
  <text x="100" y="270" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="800" fill="#FFFFFF">Imran Setiadi</text>
  <text x="100" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="600" fill="#3B82F6">Cloud Engineer</text>
  
  <text x="100" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" fill="#94A3B8" letter-spacing="1">RESILIENT INFRASTRUCTURE | DEVOPS | CLOUD OPERATIONS</text>

  <!-- Tags/Keywords -->
  <g transform="translate(100, 480)">
    <!-- Tag 1 -->
    <rect x="0" y="0" width="130" height="40" rx="20" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="65" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#F8FAFC" text-anchor="middle" dominant-baseline="middle">OpenStack</text>

    <!-- Tag 2 -->
    <rect x="145" y="0" width="130" height="40" rx="20" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="210" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#F8FAFC" text-anchor="middle" dominant-baseline="middle">OpenShift</text>

    <!-- Tag 3 -->
    <rect x="290" y="0" width="130" height="40" rx="20" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="355" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#F8FAFC" text-anchor="middle" dominant-baseline="middle">Kubernetes</text>
  </g>

  <!-- Footer link -->
  <text x="1100" y="550" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="500" fill="#64748B" text-anchor="end">imransetiadi.github.io</text>
</svg>
